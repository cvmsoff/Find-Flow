<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Find-Flow — Mobile</title>
  <meta name="author" content="Cams-Lab (Seya Gilles Cames)">
  <script>
    try { var t = localStorage.getItem('findflow.theme'); if (t === 'dark') document.documentElement.setAttribute('data-theme','dark'); } catch (e) {}
  </script>
  <link rel="stylesheet" href="../tableau-de-bord/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="../tableau-de-bord/styles/01-base.css">
  <link rel="stylesheet" href="styles/mobile.css">
</head>
<body>

  <div id="splash">
    <div class="splash-app"><span class="splash-pastille"></span><span class="splash-nom">Find-Flow</span></div>
    <div class="splash-par"><span>un produit</span><img src="../tableau-de-bord/logo/logo-camslabs.png" alt="Cams-Lab"></div>
  </div>

  <div class="m-appli">

    <!-- En-tête flottant -->
    <header class="m-tete">
      <span class="m-logo"></span>
      <div class="m-tete-titres">
        <div class="m-tete-titre" id="tete-titre">Carte</div>
        <div class="m-tete-sous" id="tete-sous"><span id="nom-client">&lt;Client&gt;</span></div>
      </div>
      <button class="m-rond" id="btn-theme" aria-label="Clair / sombre">
        <svg class="ico-soleil" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="ico-lune" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <!-- Piste d'écrans (swipe) -->
    <div class="m-corps" id="corps">

      <!-- CARTE -->
      <section class="m-ecran plein actif" id="ec-carte">
        <div id="carte"></div>
        <div id="carte-hors-ligne" hidden>Carte indisponible. Les positions restent affichées.</div>
      </section>

      <!-- APPAREILS -->
      <section class="m-ecran" id="ec-appareils">
        <input class="m-recherche" id="recherche" type="search" placeholder="Rechercher un appareil…" aria-label="Rechercher">
        <div class="m-filtres" id="filtres"></div>
        <div id="liste"><div class="m-squelette"><i></i><i></i><i></i></div></div>
      </section>

      <!-- ALERTES -->
      <section class="m-ecran" id="ec-alertes">
        <div class="stats">
          <div class="stat danger"><div class="num" id="stat-alertes">0</div><div class="lab">En alerte</div></div>
          <div class="stat ok"><div class="num" id="stat-en-ligne">0</div><div class="lab">En ligne</div></div>
        </div>
        <div class="m-titre">Appareils en alerte</div>
        <div id="liste-alertes"><div class="m-squelette"><i></i><i></i></div></div>
      </section>

      <!-- PLUS -->
      <section class="m-ecran" id="ec-plus">
        <div class="m-titre">Réglages</div>
        <button class="plus-item" id="plus-carte"><span>Fond de carte</span><span id="plus-carte-val">Plan</span></button>
        <button class="plus-item" id="plus-avance"><span>Configuration technique</span><span>›</span></button>
        <div class="m-titre">À propos</div>
        <div class="plus-item" style="display:block">
          <div>Find-Flow <span id="version-app">0.1.0</span></div>
          <div class="m-fe-sous">Développé par Cams-Lab (Seya Gilles Cames)</div>
          <div class="m-fe-sous"><a href="mailto:cams-lab@proton.me">cams-lab@proton.me</a></div>
        </div>
        <div class="plus-pied">Usage exclusif <span id="nom-client-2">&lt;Client&gt;</span> — © 2026 Cams-Lab<br>
          <img src="../tableau-de-bord/logo/logo-camslabs.png" alt="Cams-Lab"></div>
      </section>
    </div>

    <!-- Bouton flottant (change selon l'écran) -->
    <button class="m-flottant" id="btn-flottant" hidden aria-label="Action">
      <svg id="flottant-icone" viewBox="0 0 24 24"></svg>
    </button>

    <!-- Barre du bas -->
    <nav class="m-barre">
      <button class="actif" data-ec="carte" aria-label="Carte"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.3-7-11a7 7 0 1 1 14 0c0 4.7-7 11-7 11Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span class="lb">Carte</span></button>
      <button data-ec="appareils" aria-label="Appareils"><span class="ic"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span><span class="lb">Appareils</span></button>
      <button data-ec="alertes" aria-label="Alertes"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6c0 5-2 6-2 6h16s-2-1-2-6a6 6 0 0 0-6-6ZM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span><span class="lb">Alertes</span><span class="pt" id="pt-alertes" hidden></span></button>
      <button data-ec="plus" aria-label="Plus"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></span><span class="lb">Plus</span></button>
    </nav>
  </div>

  <!-- Feuille (détails / config) -->
  <div class="m-voile" id="voile"><div class="m-feuille" id="feuille"></div></div>

  <script src="../tableau-de-bord/vendor/leaflet/leaflet.js"></script>
  <script src="../tableau-de-bord/scripts/01-config.js"></script>
  <script src="../tableau-de-bord/scripts/04-geo.js"></script>
  <script src="../tableau-de-bord/scripts/05-format.js"></script>
  <script src="../tableau-de-bord/scripts/06-donnees-demo.js"></script>
  <script src="../tableau-de-bord/scripts/07-stockage.js"></script>
  <script src="../tableau-de-bord/scripts/08-stockage-firebase.js"></script>
  <script src="../tableau-de-bord/scripts/09-choix-stockage.js"></script>
  <script src="../tableau-de-bord/scripts/20-carte.js"></script>
  <script src="../tableau-de-bord/scripts/50-alertes.js"></script>
  <script src="scripts/mobile.js"></script>
</body>
</html>
